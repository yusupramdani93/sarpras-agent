name: Release (signed)

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup LLVM-MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add mingw to PATH
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Build unsigned exe
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          .\build.ps1 -Version $v

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: sarpras-agent-unsigned
          path: dist/sarpras-agent.exe
          archive: false

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/signed/*
            dist/sarpras-agent-*.zip
            dist/SHA256SUMS.txt